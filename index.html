<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام أسواق سيف - المتزامن سحابياً</title>
    <!-- استيراد الخطوط وتصميم الواجهة -->
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input, select {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background-color: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .dot { width: 8px; height: 8px; background-color: var(--success); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>أسواق سيف (نظام الكاشير والديون المتزامن)</h1>
        <div class="sync-badge">
            <span class="dot"></span> متصل بالسحابة (تحديث فوري)
        </div>
    </header>

    <!-- نقطة البيع (POS) -->
    <div class="card">
        <h2>نقطة البيع (إضافة فاتورة جديدة)</h2>
        <div class="grid-2">
            <div class="form-group">
                <label>اسم الزبون</label>
                <input type="text" id="posClient" placeholder="اسم الزبون أو العابر...">
            </div>
            <div class="form-group">
                <label>المبلغ الإجمالي (د.ع)</label>
                <input type="number" id="posAmount" placeholder="0">
            </div>
        </div>
        <button onclick="saveInvoice()">حفظ وطباعة الفاتورة (مزامنة سحابية)</button>
    </div>

    <!-- سجل المبيعات والفواتير المتزامن -->
    <div class="card">
        <h2>سجل الفواتير والمبيعات الحية</h2>
        <table>
            <thead>
                <tr>
                    <th>اسم الزبون</th>
                    <th>المبلغ</th>
                    <th>التاريخ والوقت</th>
                </tr>
            </thead>
            <tbody id="invoicesTable">
                <tr><td colspan="3" style="text-align: center;">جاري مزامنة البيانات...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- قسم إدارة الديون (الآجل) -->
    <div class="card">
        <h2>إدارة ديون الزبائن</h2>
        <div class="grid-2">
            <div class="form-group">
                <label>اسم المدين</label>
                <input type="text" id="debtClient" placeholder="اسم الزبون...">
            </div>
            <div class="form-group">
                <label>مبلغ الدين (د.ع)</label>
                <input type="number" id="debtAmount" placeholder="0">
            </div>
        </div>
        <button onclick="saveDebt()" style="background-color: #d97706;">تسجيل الدين سحابياً</button>
        
        <table>
            <thead>
                <tr>
                    <th>اسم الزبون</th>
                    <th>مبلغ الدين</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="debtsTable">
                <tr><td colspan="3" style="text-align: center;">جاري جلب الديون...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- كود ربط Firebase المحدث (Modular SDK v10) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ استبدل هذه الإعدادات ببيانات مشروعك الخاصة من لوحة تحكم Firebase
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. حفظ فاتورة جديدة وتحديثها سحابياً
    window.saveInvoice = async function() {
        const client = document.getElementById('posClient').value.trim();
        const amount = document.getElementById('posAmount').value;

        if (!client || !amount) {
            alert('الرجاء إدخال اسم الزبون والمبلغ.');
            return;
        }

        try {
            await addDoc(collection(db, "invoices"), {
                clientName: client,
                amount: Number(amount),
                createdAt: new Date().toISOString()
            });
            document.getElementById('posClient').value = '';
            document.getElementById('posAmount').value = '';
        } catch (error) {
            console.error("خطأ في حفظ الفاتورة:", error);
            alert("حدث خطأ أثناء الاتصال بالسحابة.");
        }
    };

    // 2. حفظ دين جديد وتحديثه سحابياً
    window.saveDebt = async function() {
        const client = document.getElementById('debtClient').value.trim();
        const amount = document.getElementById('debtAmount').value;

        if (!client || !amount) {
            alert('الرجاء إدخال اسم الزبون ومبلغ الدين.');
            return;
        }

        try {
            await addDoc(collection(db, "debts"), {
                clientName: client,
                amount: Number(amount),
                createdAt: new Date().toISOString()
            });
            document.getElementById('debtClient').value = '';
            document.getElementById('debtAmount').value = '';
        } catch (error) {
            console.error("خطأ في حفظ الدين:", error);
        }
    };

    // 3. الاستماع للتغييرات الفورية لجداول الفواتير (Real-time Sync)
    function syncInvoices() {
        const q = query(collection(db, "invoices"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const tbody = document.getElementById('invoicesTable');
            tbody.innerHTML = '';
            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">لا توجد فواتير مسجلة.</td></tr>`;
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                const timeStr = data.createdAt ? new Date(data.createdAt).toLocaleTimeString('ar-IQ') : '';
                tbody.innerHTML += `
                    <tr>
                        <td>${escapeHtml(data.clientName)}</td>
                        <td>${data.amount} د.ع</td>
                        <td>${timeStr}</td>
                    </tr>
                `;
            });
        });
    }

    // 4. الاستماع للتغييرات الفورية لجدول الديون
    function syncDebts() {
        const q = query(collection(db, "debts"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const tbody = document.getElementById('debtsTable');
            tbody.innerHTML = '';
            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">لا توجد ديون مسجلة.</td></tr>`;
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                tbody.innerHTML += `
                    <tr>
                        <td>${escapeHtml(data.clientName)}</td>
                        <td>${data.amount} د.ع</td>
                        <td><span style="color: #ef4444;">مترتب بذمته</span></td>
                    </tr>
                `;
            });
        });
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    // تشغيل المزامنة الفورية عند فتح النظام
    syncInvoices();
    syncDebts();
</script>

</body>
</html>
