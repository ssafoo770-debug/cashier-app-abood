<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسواق سيف - نظام نقاط البيع المتطور</title>
    <!-- تضمين الخطوط وتنسيقات التصميم -->
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --warning-color: #ca8a04;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        /* شريط تنبيه حالة الاتصال بالإنترنت */
        #network-status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            z-index: 9999;
            transition: all 0.3s ease;
            display: none;
        }
        .net-offline { background-color: var(--danger-color); color: white; display: block !important; }
        .net-online { background-color: var(--success-color); color: white; display: block !important; }

        .container {
            max-width: 1200px;
            margin: 40px auto 20px auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h1 { margin: 0; color: var(--primary-color); font-size: 24px; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { opacity: 0.9; }

        .badge {
            background: var(--warning-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- شريط حالة الاتصال -->
    <div id="network-status-bar">جاري التحقق من الاتصال...</div>

    <div class="container">
        <header>
            <h1>أسواق سيف - نقاط البيع (POS)</h1>
            <div>
                <span id="sync-status-badge" class="badge">المزامنة: متصل</span>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <h3>إدارة المبيعات والفواتير</h3>
                <p>قم بإتمام عمليات البيع. إذا انقطع الإنترنت، سيتم حفظ العمليات في طابور الانتظار ومزامنتها تلقائياً عند عودة الاتصال.</p>
                <button onclick="createNewSale()">إصدار فاتورة جديدة</button>
            </div>

            <div class="card">
                <h3>حالة العمليات المعلقة</h3>
                <p>العمليات بانتظار المزامنة: <span id="queue-count">0</span></p>
                <button onclick="forceSync()" style="background-color: var(--success-color);">مزامنة يدوية الآن</button>
            </div>
        </div>
    </div>

    <!-- سكربت النظام مع محرك المزامنة الذكية -->
    <script>
        const STORAGE_KEY = 'al_bashawat_market_db';
        const QUEUE_KEY = 'al_bashawat_offline_queue';

        let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { sales: [], inventory: [] };
        let offlineQueue = JSON.parse(localStorage.getItem(QUEUE_KEY)) || [];

        // تحديث عداد العمليات المعلقة في الواجهة
        function updateQueueUI() {
            document.getElementById('queue-count').innerText = offlineQueue.length;
        }

        // مراقبة حالة الإنترنت
        window.addEventListener('online', () => {
            showNetworkStatus('تم استعادة الاتصال بالإنترنت. جاري مزامنة العمليات المعلقة...', 'online');
            processOfflineQueue();
        });

        window.addEventListener('offline', () => {
            showNetworkStatus('انقطع الاتصال بالإنترنت! يعمل النظام حالياً بنسخ الطوارئ والطابور المحلي.', 'offline');
        });

        function showNetworkStatus(message, type) {
            const bar = document.getElementById('network-status-bar');
            bar.innerText = message;
            bar.className = type === 'online' ? 'net-online' : 'net-offline';
            
            if (type === 'online') {
                setTimeout(() => { bar.style.display = 'none'; }, 4000);
            }
        }

        // محاكاة إنشاء عملية بيع جديدة
        fnCreateSale = function createNewSale() {
            const newSale = {
                id: 'SALE_' + Date.now(),
                date: new Date().toISOString(),
                total: Math.floor(Math.random() * 50000) + 5000,
                items: [{ name: 'مادة غذائية متنوعة', qty: 1 }]
            };

            appData.sales.push(newSale);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));

            // فحص حالة الاتصال لإرسالها للسحابة أو إضافتها للطابور
            if (navigator.onLine) {
                syncTransactionToCloud(newSale);
            } else {
                offlineQueue.push(newSale);
                localStorage.setItem(QUEUE_KEY, JSON.stringify(offlineQueue));
                updateQueueUI();
                alert('لا يوجد إنترنت! تم حفظ الفاتورة محلياً وسيتم مزامنتها تلقائياً عند عودة الاتصال.');
            }
        };

        // محاكاة إرسال البيانات للخادم أو Firebase
        function syncTransactionToCloud(transaction) {
            console.log('جاري إرسال العملية إلى السحابة...', transaction);
            // محاكاة استجابة ناجحة من السحابة
            setTimeout(() => {
                document.getElementById('sync-status-badge').innerText = 'المزامنة: محدث';
                setTimeout(() => { document.getElementById('sync-status-badge').innerText = 'المزامنة: متصل'; }, 2000);
            }, 500);
        }

        // معالجة طابور العمليات المعلقة فور عودة الإنترنت
        function processOfflineQueue() {
            if (offlineQueue.length === 0) return;

            console.log('جاري مزامنة الطابور المعلق (' + offlineQueue.length + ' عملية)...');
            
            // إرسال جميع العمليات دفعة واحدة أو بالترتيب
            while (offlineQueue.length > 0) {
                const item = offlineQueue.shift();
                syncTransactionToCloud(item);
            }

            localStorage.setItem(QUEUE_KEY, JSON.stringify(offlineQueue));
            updateQueueUI();
            alert('تمت مزامنة جميع العمليات المعلقة بنجاح مع السحابة!');
        }

        // مزامنة يدوية
        function forceSync() {
            if (!navigator.onLine) {
                alert('عذراً، لا يوجد اتصال بالإنترنت حالياً لإتمام المزامنة.');
                return;
            }
            processOfflineQueue();
            alert('تم التحقق ومزامنة كافة البيانات بنجاح.');
        }

        // التحقق الأولي عند التحميل
        window.onload = function() {
            updateQueueUI();
            if (!navigator.onLine) {
                showNetworkStatus('الجهاز يعمل حالياً بدون إنترنت (وضع الطوارئ)', 'offline');
            }
        };
    </script>
</body>
</html>
