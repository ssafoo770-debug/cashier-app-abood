<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة جانبية منزلقة</title>
  <style>
    /* 1. التنسيقات العامة */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f9;
    }

    /* زر فتح القائمة */
    .toggle-btn {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .toggle-btn:hover {
      background-color: #2980b9;
    }

    /* 2. تنسيق القائمة الجانبية المنزلقة */
    .sidebar {
      position: fixed;
      top: 0;
      right: -260px; /* إخفاء القائمة جهة اليمين خارج الشاشة */
      width: 250px;
      height: 100%;
      background-color: #2c3e50;
      color: #fff;
      transition: right 0.3s ease; /* حركة الانزلاق السلسة */
      z-index: 1000;
      box-shadow: -2px 0 5px rgba(0,0,0,0.2);
    }

    /* عند إضافة كلاس active تظهر القائمة */
    .sidebar.active {
      right: 0;
    }

    /* زر الإغلاق داخل القائمة */
    .close-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 24px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    /* روابط القائمة */
    .sidebar ul {
      list-style: none;
      padding: 60px 0 0 0;
      margin: 0;
    }

    .sidebar ul li a {
      display: block;
      padding: 15px 25px;
      color: #ecf0f1;
      text-decoration: none;
      border-bottom: 1px solid #34495e;
      transition: background 0.2s;
    }

    .sidebar ul li a:hover {
      background-color: #34495e;
    }

    /* 3. خلفية معتمة عند فتح القائمة */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 999;
    }

    .overlay.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- زر فتح القائمة الجانبية -->
  <button id="openSidebarBtn" class="toggle-btn">☰ فتح القائمة</button>

  <!-- القائمة الجانبية -->
  <div id="sidebar" class="sidebar">
    <button id="closeSidebarBtn" class="close-btn">&times;</button>
    <ul>
      <li><a href="#">الرئيسية</a></li>
      <li><a href="#">الخدمات</a></li>
      <li><a href="#">عن الشركة</a></li>
      <li><a href="#">اتصل بنا</a></li>
    </ul>
  </div>

  <!-- الخلفية المعتمة -->
  <div id="overlay" class="overlay"></div>

  <!-- البرمجة (JavaScript) -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const openBtn = document.getElementById('openSidebarBtn');
    const closeBtn = document.getElementById('closeSidebarBtn');
    const overlay = document.getElementById('overlay');

    // وظيفة فتح القائمة
    openBtn.addEventListener('click', () => {
      sidebar.classList.add('active');
      overlay.classList.add('active');
    });

    // وظيفة إغلاق القائمة
    const closeSidebar = () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
    };

    closeBtn.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);
  </script>

</body>
</html>
