<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفكرة سيف - النظام الجديد</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none;
        }

        .welcome-screen {
            text-align: center;
        }

        .logout-btn {
            background-color: #ef4444;
            margin-top: 2rem;
        }

        .logout-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="loginSection">
            <h2>تسجيل الدخول</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required placeholder="أدخل كلمة المرور">
                </div>
                <button type="submit">دخول</button>
            </form>
        </div>

        <!-- الشاشة الرئيسية للمفكرة بعد تسجيل الدخول -->
        <div id="appSection" class="welcome-screen hidden">
            <h2>مفكرة سيف الجديدة</h2>
            <p id="userWelcomeMsg" style="margin-bottom: 1rem; color: #4b5563;"></p>
            <textarea id="noteContent" rows="6" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; resize: vertical;" placeholder="اكتب ملاحظاتك هنا..."></textarea>
            <button onclick="saveNote()">حفظ الملاحظة</button>
            <button class="logout-btn" onclick="handleLogout()">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        // التهيئة الافتراضية وحفظ الحساب الوحيد الجديد في الـ LocalStorage إذا لم يكن موجوداً
        function initStorage() {
            if (!localStorage.getItem('seif_users')) {
                // الحساب الوحيد الجديد المعتمد
                const defaultUser = [{
                    username: "seif",
                    password: "123"
                }];
                localStorage.setItem('seif_users', JSON.stringify(defaultUser));
            }
        }

        // تنفيذ التهيئة عند تحميل الصفحة
        window.onload = function() {
            initStorage();
            const loggedInUser = localStorage.getItem('seif_logged_in');
            if (loggedInUser) {
                showApp(loggedInUser);
            }
        };

        // دالة تسجيل الدخول والتحقق
        function handleLogin(event) {
            event.preventDefault();
            const userInput = document.getElementById('username').value.trim();
            const passInput = document.getElementById('password').value.trim();

            const users = JSON.parse(localStorage.getItem('seif_users')) || [];
            
            // مطابقة البيانات مع الحساب الوحيد المخزن
            const validUser = users.find(u => u.username === userInput && u.password === passInput);

            if (validUser) {
                localStorage.setItem('seif_logged_in', validUser.username);
                showApp(validUser.username);
            } else {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
            }
        }

        // الانتقال لواجهة المفكرة
        function showApp(username) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            document.getElementById('userWelcomeMsg').innerText = `أهلاً بك، ${username}`;
            
            // استرجاع الملاحظة المحفوظة مسبقاً إن وجدت
            const savedNote = localStorage.getItem('seif_current_note') || '';
            document.getElementById('noteContent').value = savedNote;
        }

        // حفظ الملاحظة في الـ LocalStorage
        function saveNote() {
            const noteText = document.getElementById('noteContent').value;
            localStorage.setItem('seif_current_note', noteText);
            alert('تم حفظ الملاحظة بنجاح!');
        }

        // تسحيل الخروج
        function handleLogout() {
            localStorage.removeItem('seif_logged_in');
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        }
    </script>
</body>
</html>
